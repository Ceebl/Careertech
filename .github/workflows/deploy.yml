name: Deploy to Server

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Never let two deploys touch the server at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        env:
          KB_READER_PASSWORD: ${{ secrets.KB_READER_PASSWORD }}
          KB_ADMIN_PASSWORD: ${{ secrets.KB_ADMIN_PASSWORD }}
          # Only ever used to create the very first account on an empty tasks
          # database. Once an account exists these are read and ignored.
          TASKS_ADMIN_USER: ${{ secrets.TASKS_ADMIN_USER }}
          TASKS_ADMIN_PASSWORD: ${{ secrets.TASKS_ADMIN_PASSWORD }}
        with:
          envs: KB_READER_PASSWORD,KB_ADMIN_PASSWORD,TASKS_ADMIN_USER,TASKS_ADMIN_PASSWORD
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -euo pipefail

            REPO_URL=https://github.com/Ceebl/Careertech.git
            # nginx's root for emaitch.co.uk is /var/www/html, so static sites
            # must land there. Deploy scaffolding stays in /var/www, outside the
            # web root, so it is never publicly reachable.
            WEB_ROOT=/var/www/html
            LEGACY_ROOT=/var/www
            TMP=/var/www/careertech-temp
            MANIFEST=/var/www/.careertech-manifest
            DATA_DIR=/srv/careertech/data
            TASKS_DATA_DIR=/srv/careertech/tasks-data
            DOMAIN=emaitch.co.uk
            # Folders that are not published as static sites.
            # targetconnect-probe is internal research notes and must never be
            # served. Listing it here also makes step 2 delete the copy that
            # earlier deploys already published.
            EXCLUDE=".github api infra tasks targetconnect-probe"
            # Published, but left off the homepage: shared assets and support
            # folders rather than projects a visitor would click into.
            HIDE_FROM_HOMEPAGE="brand"

            echo "::: fetching repo"
            sudo rm -rf "$TMP"
            sudo git clone --depth 1 "$REPO_URL" "$TMP"
            ME=$(id -un)
            sudo chown -R "$ME":"$ME" "$TMP"

            # ---------------------------------------------------------------
            # 1. Publish each project folder as a static site
            # ---------------------------------------------------------------
            echo "::: syncing static projects"
            NEW_LIST=$(mktemp)

            for dir in "$TMP"/*/; do
              folder=$(basename "$dir")
              case " $EXCLUDE " in *" $folder "*) continue ;; esac

              sudo rsync -a --delete "$dir" "$WEB_ROOT/$folder/"
              sudo chown -R www-data:www-data "$WEB_ROOT/$folder"
              echo "$folder" >> "$NEW_LIST"
              echo "  deployed /$folder"
            done

            # ---------------------------------------------------------------
            # 2. Remove folders deleted from the repo
            #
            # Only folders this workflow deployed last time are considered, so
            # anything else living in /var/www is never touched.
            # ---------------------------------------------------------------
            # Consider every name we have ever deployed, plus the current ones.
            CANDIDATES=$(mktemp)
            if sudo test -f "$MANIFEST"; then
              sudo cat "$MANIFEST" >> "$CANDIDATES"
            fi
            cat "$NEW_LIST" >> "$CANDIDATES"

            sort -u "$CANDIDATES" | while IFS= read -r name; do
              [ -n "$name" ] || continue

              # Refuse anything that is not a plain folder name, and never
              # touch the web root directory itself.
              case "$name" in
                *[!A-Za-z0-9._-]*|.|..|html)
                  echo "  !! skipping unsafe name: $name"; continue ;;
              esac

              # Older deploys wrote to /var/www/<name>, which nginx never served.
              # Clear those out; the live copy is in $WEB_ROOT now.
              stale="$LEGACY_ROOT/$name"
              if [ ! -L "$stale" ] && [ -d "$stale" ]; then
                sudo rm -rf "$stale"
                echo "  cleaned stale copy at $stale"
              fi

              # Still in the repo? Then it stays.
              if grep -qxF "$name" "$NEW_LIST"; then continue; fi

              target="$WEB_ROOT/$name"
              if [ -L "$target" ]; then
                echo "  !! skipping symlink: $target"
              elif [ -d "$target" ]; then
                sudo rm -rf "$target"
                echo "  removed /$name (deleted from repo)"
              fi
            done
            rm -f "$CANDIDATES"

            sudo cp "$NEW_LIST" "$MANIFEST"
            sudo chmod 644 "$MANIFEST"

            # Homepage is generated from the list above, so it always matches
            # what is actually deployed.
            echo "::: writing homepage"
            sudo python3 "$TMP/infra/make_homepage.py" \
              --list "$NEW_LIST" --out "$WEB_ROOT/index.html" \
              --hide "$HIDE_FROM_HOMEPAGE"
            sudo chown www-data:www-data "$WEB_ROOT/index.html"

            rm -f "$NEW_LIST"

            # ---------------------------------------------------------------
            # 3. Build and restart the shared backend
            # ---------------------------------------------------------------
            if [ -d "$TMP/api" ]; then
              echo "::: building api image"
              sudo mkdir -p "$DATA_DIR"
              # The image runs as the unprivileged `node` user (uid 1000).
              sudo chown -R 1000:1000 "$DATA_DIR"

              sudo docker build -t careertech-api:latest "$TMP/api"

              # Secrets go in a root-only file rather than on the docker command
              # line, where `ps` would expose them to any user on the box.
              ENV_FILE=/srv/careertech/app.env
              sudo touch "$ENV_FILE"
              sudo chmod 600 "$ENV_FILE"
              printf '%s\n' \
                "KB_READER_PASSWORD=${KB_READER_PASSWORD:-}" \
                "KB_ADMIN_PASSWORD=${KB_ADMIN_PASSWORD:-}" \
                | sudo tee "$ENV_FILE" >/dev/null

              sudo docker rm -f careertech-api >/dev/null 2>&1 || true
              sudo docker run -d \
                --name careertech-api \
                --restart unless-stopped \
                -p 127.0.0.1:3000:3000 \
                -v "$DATA_DIR":/data \
                --env-file "$ENV_FILE" \
                -e NODE_ENV=production \
                -e DATA_DIR=/data \
                --memory 512m \
                --cpus 1 \
                careertech-api:latest

              echo "::: waiting for api to become healthy"
              healthy=0
              for _ in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
                  healthy=1; break
                fi
                # Fall back to asking the container itself, so the check does
                # not depend on what is installed on the host.
                if sudo docker exec careertech-api node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" >/dev/null 2>&1; then
                  healthy=1
                  break
                fi
                sleep 2
              done

              if [ "$healthy" -ne 1 ]; then
                echo "!! api did not come up -- last 50 log lines:"
                sudo docker logs --tail 50 careertech-api || true
                exit 1
              fi
              echo "  api healthy"

              sudo docker image prune -f >/dev/null

            fi

            # ---------------------------------------------------------------
            # 4. Build and restart the tasks app
            #
            # Its own image, own port and own volume, deliberately. It holds the
            # only data on this box that would actually hurt to lose or leak,
            # and careertech-api serves endpoints that are open to anyone.
            # ---------------------------------------------------------------
            if [ -d "$TMP/tasks" ]; then
              echo "::: building tasks image"
              sudo mkdir -p "$TASKS_DATA_DIR"
              # The image runs as the unprivileged `node` user (uid 1000), and
              # the database and session key must not be readable by anyone
              # else on the box.
              sudo chown -R 1000:1000 "$TASKS_DATA_DIR"
              sudo chmod 700 "$TASKS_DATA_DIR"

              sudo docker build -t careertech-tasks:latest "$TMP/tasks"

              # Secrets go in a root-only file rather than on the docker command
              # line, where `ps` would expose them to any user on the box.
              TASKS_ENV_FILE=/srv/careertech/tasks.env
              sudo touch "$TASKS_ENV_FILE"
              sudo chmod 600 "$TASKS_ENV_FILE"
              printf '%s\n' \
                "TASKS_ADMIN_USER=${TASKS_ADMIN_USER:-}" \
                "TASKS_ADMIN_PASSWORD=${TASKS_ADMIN_PASSWORD:-}" \
                | sudo tee "$TASKS_ENV_FILE" >/dev/null

              sudo docker rm -f careertech-tasks >/dev/null 2>&1 || true
              sudo docker run -d \
                --name careertech-tasks \
                --restart unless-stopped \
                -p 127.0.0.1:3001:3001 \
                -v "$TASKS_DATA_DIR":/data \
                --env-file "$TASKS_ENV_FILE" \
                -e NODE_ENV=production \
                -e DATA_DIR=/data \
                --memory 512m \
                --cpus 1 \
                careertech-tasks:latest

              echo "::: waiting for tasks to become healthy"
              healthy=0
              for _ in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:3001/tasks/health >/dev/null 2>&1; then
                  healthy=1; break
                fi
                # Fall back to asking the container itself, so the check does
                # not depend on what is installed on the host.
                if sudo docker exec careertech-tasks node -e "fetch('http://localhost:3001/tasks/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" >/dev/null 2>&1; then
                  healthy=1
                  break
                fi
                sleep 2
              done

              if [ "$healthy" -ne 1 ]; then
                echo "!! tasks did not come up -- last 50 log lines:"
                sudo docker logs --tail 50 careertech-tasks || true
                exit 1
              fi
              echo "  tasks healthy"

              sudo docker image prune -f >/dev/null
            fi

            # ---------------------------------------------------------------
            # 5. Point nginx at both containers (idempotent)
            #
            # One include line per project, wired separately, so adding or
            # removing one cannot disturb the other.
            # ---------------------------------------------------------------
            echo "::: wiring nginx"
            sudo mkdir -p /etc/nginx/snippets
            sudo cp "$TMP/infra/careertech-api.conf"   /etc/nginx/snippets/careertech-api.conf
            sudo cp "$TMP/infra/careertech-tasks.conf" /etc/nginx/snippets/careertech-tasks.conf

            WIRE_OUT=$(
              sudo python3 "$TMP/infra/wire_nginx.py" --domain "$DOMAIN"
              sudo python3 "$TMP/infra/wire_nginx.py" --domain "$DOMAIN" \
                --include /etc/nginx/snippets/careertech-tasks.conf
            )
            echo "$WIRE_OUT"

            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "  nginx reloaded"
            else
              # Restore the oldest backup taken in this run: it predates every
              # change made above, so one copy undoes all of them.
              BACKUP=$(printf '%s\n' "$WIRE_OUT" | sed -n 's/^backup: //p' | head -n 1)
              WIRED=$(printf '%s\n' "$WIRE_OUT" | sed -n 's/^wired: //p' | head -n 1)
              if [ -n "$BACKUP" ] && [ -n "$WIRED" ]; then
                sudo cp "$BACKUP" "$WIRED"
                echo "!! nginx test failed -- config rolled back"
              else
                echo "!! nginx test failed -- no change to roll back"
              fi
              exit 1
            fi

            sudo rm -rf "$TMP"
            echo "::: deploy complete"
