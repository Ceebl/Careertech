name: Deploy to Server

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_KEY }}
        script: |
          cd /var/www
          sudo rm -rf careertech-temp
          sudo git clone https://github.com/Ceebl/Careertech.git careertech-temp
          sudo chown -R mike:mike careertech-temp
          
          # Deploy all folders except .github
          for dir in /var/www/careertech-temp/*/; do
            folder=$(basename "$dir")
            if [[ "$folder" != ".github" ]]; then
              sudo rsync -av --delete "$dir" /var/www/"$folder"/
              sudo chown -R www-data:www-data /var/www/"$folder"
            fi
          done
          
          sudo rm -rf /var/www/careertech-temp
