<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello — Careertech</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1a1a; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --card: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e8e8e8; --muted: #9ca3af;
      --line: #262b35; --accent: #60a5fa; --card: #161a22;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem; background: var(--bg); color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 .25rem; }
  p.sub { color: var(--muted); margin: 0 0 2rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1rem; }
  input, button {
    font: inherit; padding: .6rem .8rem;
    border: 1px solid var(--line); border-radius: 8px;
  }
  input { flex: 1; min-width: 0; background: var(--bg); color: var(--fg); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { background: var(--accent); color: #fff; border-color: transparent; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  #status { min-height: 1.5rem; color: var(--muted); font-size: .9rem; }
  #status[data-error="true"] { color: #dc2626; }
  ul { list-style: none; padding: 0; margin: 0; }
  li {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: .7rem .9rem; margin-bottom: .5rem;
  }
  time { display: block; color: var(--muted); font-size: .8rem; margin-top: .2rem; }
</style>
</head>
<body>
<main>
  <h1>Hello</h1>
  <p class="sub">Template project — a static page talking to <code>/api/hello</code>.</p>

  <form id="form">
    <input id="text" maxlength="280" placeholder="Write a note…" autocomplete="off" required>
    <button type="submit">Save</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <ul id="notes"></ul>
</main>

<script>
  const API = '/api/hello';
  const form = document.getElementById('form');
  const input = document.getElementById('text');
  const button = form.querySelector('button');
  const status = document.getElementById('status');
  const list = document.getElementById('notes');

  function say(message, isError) {
    status.textContent = message;
    status.dataset.error = Boolean(isError);
  }

  function render(notes) {
    list.replaceChildren(...notes.map((note) => {
      const li = document.createElement('li');
      // textContent, not innerHTML -- the note text is user input.
      li.textContent = note.text;
      const time = document.createElement('time');
      time.textContent = note.created_at + ' UTC';
      li.append(time);
      return li;
    }));
  }

  async function load() {
    try {
      const res = await fetch(API);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data.notes);
      say(data.notes.length ? '' : 'No notes yet.');
    } catch (err) {
      say('Could not reach the API: ' + err.message, true);
    }
  }

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    button.disabled = true;
    say('Saving…');
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      input.value = '';
      await load();
    } catch (err) {
      say(err.message, true);
    } finally {
      button.disabled = false;
    }
  });

  load();
</script>
</body>
</html>
