; CouchDB settings required by Obsidian Self-hosted LiveSync.
;
; Copied to /srv/careertech/couchdb-config/ by the deploy, which the container
; mounts at /opt/couchdb/etc/local.d. CouchDB reads every .ini in that folder
; in alphabetical order; the official image drops its own docker.ini there with
; the admin account in it, and this file sorts first and sets different keys, so
; the two do not fight.
;
; Changing a value here needs a container restart -- the deploy does that.

[couchdb]
; Tells a one-machine CouchDB to finish setting itself up rather than waiting
; to be told about other nodes in a cluster.
single_node = true
; A single note, with its history, is allowed to reach 50MB.
max_document_size = 50000000

[chttpd]
; Nothing is readable without logging in. This is the setting that keeps the
; vault private, since the database is reachable from the open internet.
require_valid_user = true
; ...with one hole in it, on purpose: /_up, the "are you alive?" endpoint, is
; left open so the deploy can check the container started. Without this the
; deploy's health check gets a 401, decides CouchDB never came up, and stops
; before it wires nginx -- which is exactly what happened on the first attempt.
;
; Verified on this server, on 3.5.2.1, with both settings on: /_up answers 200
; while /, /_users and the vault database all still answer 401. Worth knowing
; that in CouchDB 3.0.0 this option was broken and switched authentication off
; everywhere (CVE-2020-1955); it was fixed in 3.0.1, long before this version.
require_valid_user_except_for_up = true
max_http_request_size = 4294967296
enable_cors = true

[chttpd_auth]
require_valid_user = true
authentication_redirect = /_utils/session.html

[httpd]
; Makes CouchDB answer with a plain login challenge instead of an HTML page,
; which is what the plugin expects.
WWW-Authenticate = Basic realm="couchdb"
enable_cors = true

[cors]
credentials = true
; Obsidian is not a normal web page, so its requests arrive from these three
; made-up origins: app:// is the desktop app, capacitor:// is iOS and Android,
; http://localhost is the phone apps in some versions. Miss one and that
; device alone fails to sync, silently -- this is the single most common cause
; of "works on my laptop, does nothing on my phone".
origins = app://obsidian.md,capacitor://localhost,http://localhost
headers = accept, authorization, content-type, origin, referer
methods = GET, PUT, POST, HEAD, DELETE
max_age = 3600
