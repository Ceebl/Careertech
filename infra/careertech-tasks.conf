# Routes https://emaitch.co.uk/tasks/ to the tasks container.
#
# Included into the HTTPS server block by infra/wire_nginx.py during deploy.
#
# A separate container from careertech-api on purpose, so this is a separate
# snippet pointing at a separate port. See tasks/Dockerfile for why.

location /tasks/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The app sends no-store on every page of its own, but say it here too so a
    # private board is never cached by anything between nginx and the browser.
    proxy_no_cache 1;
    proxy_cache_bypass 1;

    # Nothing here is uploaded; the largest request is a form post.
    client_max_body_size 1m;
    proxy_read_timeout   60s;
    proxy_connect_timeout 5s;

    # Surface a clear error instead of hanging if the container is down.
    proxy_next_upstream off;
}

# Without this, /tasks (no trailing slash) 404s from disk instead of reaching
# the app, because nginx tries the filesystem before any proxy rule.
location = /tasks {
    return 301 /tasks/;
}
