# Routes https://couch.emaitch.co.uk/ to the CouchDB container that Obsidian's
# Self-hosted LiveSync plugin syncs against.
#
# Included into the HTTPS server block for couch.emaitch.co.uk by
# infra/wire_nginx.py during deploy. The site file itself is created once by
# infra/setup-couchdb.sh and is then owned by certbot -- the deploy copies this
# snippet but must never rewrite that file, or the certificate wiring would be
# undone on every push.
#
# CouchDB gets a hostname to itself on purpose. Obsidian stores each note under
# a document id built from its file path, so a note inside a folder is fetched
# as `folder%2Fnote.md`. Proxying from a sub-path such as /couchdb/ makes nginx
# decode that %2F back into a real slash while it rewrites the prefix, and the
# note then fails to sync with no visible error. At the root of a hostname
# there is no prefix to rewrite and nothing gets decoded.

location / {
    proxy_pass http://127.0.0.1:5984;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # CouchDB sends its own CORS headers -- see infra/couchdb-livesync.ini.
    # Do NOT add CORS headers here as well. Two copies of
    # Access-Control-Allow-Origin is an error, and the phone app reacts by
    # refusing to connect without ever saying why.

    # LiveSync keeps a long _changes request open to watch for edits made on
    # other devices. With buffering on, nginx holds the response back and sync
    # looks like it has stalled.
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_connect_timeout 5s;

    # The plugin splits files into chunks, but a batch still arrives as one
    # request. nginx's 1m default shows up as a "413" when an image is added.
    client_max_body_size 256m;
}
