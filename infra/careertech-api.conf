# Routes https://emaitch.co.uk/api/... to the shared backend container.
# Included into the HTTPS server block by infra/wire_nginx.py during deploy.

location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keep requests small and fast -- this is a 2GB box.
    client_max_body_size 2m;
    proxy_read_timeout   60s;
    proxy_connect_timeout 5s;

    # Surface a clear error instead of hanging if the container is down.
    proxy_next_upstream off;
}
